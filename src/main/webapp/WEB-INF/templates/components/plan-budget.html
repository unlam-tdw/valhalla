<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="summary" id="presupuesto" class="plan-budget mt-2 p-2 border rounded text-break" aria-labelledby="budget-heading"
         th:with="isSurprise=${plan.budget != null and plan.budget.notes != null and plan.budget.notes.startsWith('Sorprendeme:')}">
  <h3 id="budget-heading" class="h6 fw-bold mb-1 d-inline-flex align-items-center gap-2"><svg class="plan-budget-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M16 10h5v4h-5a2 2 0 0 1 0-4Z"/></svg>Presupuesto</h3>

  <p class="mb-0 small" th:if="${plan.budget != null and plan.budget.estimated}">
    <span class="text-muted">Tu presupuesto: </span>
    <strong>ARS <span th:text="${#numbers.formatDecimal(plan.budget.minimum, 1, 'POINT', 2, 'COMMA')}"></span></strong>
    <span class="text-muted"> / persona</span><span th:if="${plan.budget.people != null and plan.budget.people > 1}" class="text-muted"> · <span th:text="${plan.budget.people}"></span> pers. = ARS <span th:text="${#numbers.formatDecimal(plan.budget.minimum * plan.budget.people, 1, 'POINT', 2, 'COMMA')}"></span></span>
  </p>
  <p class="small text-muted mb-0" th:unless="${plan.budget != null and plan.budget.estimated}">Sin presupuesto definido.</p>

  <p id="itinerary-estimate" class="small mb-0 mt-1" hidden>
    <span class="text-muted">Costo estimado: </span>
    <strong>ARS <span id="itinerary-estimated-cost">0,00</span></strong><span class="text-muted"> / persona</span><span id="itinerary-estimate-people" class="text-muted" th:if="${plan.budget.people != null and plan.budget.people > 1}"> · total ARS <span id="itinerary-estimated-total">0,00</span></span>
    <span id="itinerary-over-budget" class="text-danger fw-semibold" hidden> · te pasás por ARS <span id="itinerary-over-amount">0,00</span><span th:if="${plan.budget.people != null and plan.budget.people > 1}"> / pers.</span></span>
  </p>

  <p th:if="${isSurprise}" class="small text-muted mb-0 mt-1">Plan sorpresa · ajustá las paradas desde el detalle.</p>
  <div th:if="${!isSurprise and !#strings.isEmpty(plan.budget.notes)}" class="mt-1" data-budget-description>
    <p id="budget-description" class="plan-budget-notes small mb-0" style="white-space: pre-line" th:text="${plan.budget.notes}"></p>
    <button type="button" class="btn btn-link btn-sm p-0" aria-controls="budget-description" aria-expanded="false" hidden>Ver m&aacute;s</button>
  </div>
</section>
</body>
</html>
