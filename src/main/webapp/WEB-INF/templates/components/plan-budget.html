<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="summary" id="presupuesto" class="plan-budget mt-2 p-2 border rounded text-break" aria-labelledby="budget-heading">
  <div class="d-flex flex-wrap align-items-baseline justify-content-between gap-1">
    <h3 id="budget-heading" class="h6 fw-bold mb-0 d-inline-flex align-items-center gap-2"><svg class="plan-budget-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M16 10h5v4h-5a2 2 0 0 1 0-4Z"/></svg>Presupuesto estimado</h3>
  <p class="plan-budget-amount mb-0" th:if="${plan.budget.estimated}">
    <strong>ARS <span th:text="${#numbers.formatDecimal(plan.budget.minimum, 1, 'POINT', 2, 'COMMA')}"></span><span th:if="${plan.budget.range}"> &ndash; <span th:text="${#numbers.formatDecimal(plan.budget.maximum, 1, 'POINT', 2, 'COMMA')}"></span></span></strong>
  </p>
  <p class="small text-muted mb-0" th:unless="${plan.budget.estimated}">Sin estimar</p>
  </div>
  <div th:if="${!#strings.isEmpty(plan.budget.notes)}" class="mt-1" data-budget-description>
    <p id="budget-description" class="plan-budget-notes small mb-0" style="white-space: pre-line" th:text="${plan.budget.notes}"></p>
    <button type="button" class="btn btn-link btn-sm p-0" aria-controls="budget-description" aria-expanded="false" hidden>Ver m&aacute;s</button>
  </div>
</section>
</body>
</html>
