<div th:fragment="picker(currentValue)" xmlns:th="http://www.thymeleaf.org"
  class="space-y-2" id="avatar-picker">

  <!-- [PROF] AC-23: picker de avatar compartido por /auth/register y el edit del perfil. La
       galeria son los 3 SVG de marca bundleados en /images/avatars (PROF-012); "ninguno" borra
       el valor, y el input de texto queda abierto para URLs https:// propias (AC-25 valida el
       formato server-side). Un solo puntito de JS, vanilla y embebido, mantiene preview y
       seleccion. No hay upload: el manejo de archivos es una card propria a futuro. -->

  <div class="flex flex-wrap items-center gap-3">
    <!-- th:attr checked-states: marcar la opcion activa segun el valor actual -->
    <button type="button" data-avatar-value="" data-avatar-none="true"
      class="avatar-choice inline-flex h-14 w-14 items-center justify-center rounded-full border-2 border-dashed border-gray-300 text-gray-400 hover:border-blue-500 hover:text-blue-500"
      th:classappend="${(currentValue == null or #strings.trim(currentValue) == '')} ? 'avatar-selected ring-2 ring-blue-500' : ''"
      title="Sin avatar">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
    </button>

    <button type="button" data-avatar-value="/images/avatars/avatar-1.svg"
      class="avatar-choice h-14 w-14 rounded-full border-2 border-transparent hover:border-blue-500"
      th:classappend="${currentValue == '/images/avatars/avatar-1.svg'} ? 'avatar-selected border-blue-500 ring-2 ring-blue-500' : ''">
      <img src="/images/avatars/avatar-1.svg" alt="Avatar 1" class="h-14 w-14 rounded-full object-cover" />
    </button>

    <button type="button" data-avatar-value="/images/avatars/avatar-2.svg"
      class="avatar-choice h-14 w-14 rounded-full border-2 border-transparent hover:border-blue-500"
      th:classappend="${currentValue == '/images/avatars/avatar-2.svg'} ? 'avatar-selected border-blue-500 ring-2 ring-blue-500' : ''">
      <img src="/images/avatars/avatar-2.svg" alt="Avatar 2" class="h-14 w-14 rounded-full object-cover" />
    </button>

    <button type="button" data-avatar-value="/images/avatars/avatar-3.svg"
      class="avatar-choice h-14 w-14 rounded-full border-2 border-transparent hover:border-blue-500"
      th:classappend="${currentValue == '/images/avatars/avatar-3.svg'} ? 'avatar-selected border-blue-500 ring-2 ring-blue-500' : ''">
      <img src="/images/avatars/avatar-3.svg" alt="Avatar 3" class="h-14 w-14 rounded-full object-cover" />
    </button>

    <!-- Preview del valor vigente (la URL custom tambien). Se vacia si el formato no es
         renderizable (https o galeria): el server igualmente valida (AC-25). -->
    <img id="avatar-preview" alt="Preview del avatar"
      th:if="${currentValue != null and !#strings.trim(currentValue).isEmpty()}"
      th:src="${currentValue}"
      class="avatar-preview h-14 w-14 rounded-full object-cover ring-2 ring-gray-200" />
  </div>

  <input type="text" id="avatarUrl" name="avatarUrl" autocomplete="off"
    th:attr="value=${currentValue != null ? currentValue : ''}"
    placeholder="URL del avatar (https://... o elige de la galeria)"
    class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none" />

  <script>
    (function () {
      var picker = document.getElementById("avatar-picker");
      if (!picker) return;
      var input = document.getElementById("avatarUrl");
      var preview = document.getElementById("avatar-preview");
      var choices = picker.querySelectorAll(".avatar-choice");
      var renderable = function (value) {
        if (!value) return false;
        return value.indexOf("https://") === 0 || value.indexOf("/images/avatars/") === 0;
      };
      for (var i = 0; i < choices.length; i++) {
        choices[i].addEventListener("click", function () {
          input.value = this.getAttribute("data-avatar-value");
          for (var j = 0; j < choices.length; j++) {
            choices[j].classList.remove("avatar-selected", "ring-2", "ring-blue-500", "border-blue-500");
          }
          this.classList.add("avatar-selected", "ring-2", "ring-blue-500");
          this.classList.add(this.hasAttribute("data-avatar-none") ? "border-dashed" : "border-blue-500");
          if (preview) {
            var v = input.value;
            if (renderable(v)) {
              preview.src = v;
              preview.removeAttribute("data-hidden");
            } else {
              preview.setAttribute("data-hidden", "true");
            }
          }
        });
      }
      if (preview) {
        input.addEventListener("input", function () {
          if (!renderable(input.value)) {
            preview.setAttribute("data-hidden", "true");
            return;
          }
          preview.removeAttribute("data-hidden");
          preview.src = input.value;
        });
      }
    })();
  </script>
</div>
