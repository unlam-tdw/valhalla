<nav th:fragment="navbar" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  class="flex items-center justify-between bg-black px-4 text-white shadow">

  <!-- Logo principal: va a /admin/home si es admin, o a / si es usuario común / público.
       El color sale del token de marca, declarado en resources/css/brand.css y expuesto a
       Tailwind por el bloque @theme de layouts/base :: head. La clase navbar-brand se
       conserva porque es el hook que leen los tests del navbar. -->
  <a class="navbar-brand inline-flex items-center gap-2 py-3 font-serif text-xl font-bold text-secondary hover:text-white"
    sec:authorize="hasRole('ADMIN')" th:href="@{/admin/home}">
    <img th:src="@{/images/logo.svg}" alt="Logo" class="h-12 w-12 object-contain" />
    <span>PlanIt</span>
  </a>
  <a class="navbar-brand inline-flex items-center gap-2 py-3 font-serif text-xl font-bold text-secondary hover:text-white"
    sec:authorize="!hasRole('ADMIN')" th:href="@{/}">
    <img th:src="@{/images/logo.svg}" alt="Logo" class="h-12 w-12 object-contain" />
    <span>PlanIt</span>
  </a>

  <!-- Usuario AUTENTICADO -->
  <div sec:authorize="isAuthenticated()" class="flex items-center gap-4 text-sm">
    <!-- Front door to the admin panel; the only destination an admin needs. -->
    <a th:href="@{/admin/users}" sec:authorize="hasRole('ADMIN')"
      class="rounded-md bg-primary px-3 py-2 font-medium hover:bg-secondary">
      Users
    </a>

    <!-- Rutas del usuario común: /explore es el catálogo y /plans su listado. 04a453d lo
         habia sacado para no dejar un item de menu apuntando a un 404. -->
    <a th:href="@{/explore}" sec:authorize="!hasRole('ADMIN')"
      class="rounded-md bg-primary px-3 py-2 font-medium hover:bg-secondary">
      Explore
    </a>
    <a th:href="@{/plans}" sec:authorize="!hasRole('ADMIN')"
      class="rounded-md bg-primary px-3 py-2 font-medium hover:bg-secondary">
      Plans
    </a>

    <!-- Avatar with the first initial of the real name; userInitial/userDisplayName come from
         CurrentUserControllerAdvice (AppUserDetails after a real login, login name otherwise).
         Deliberately a span, not an <a>: the E2E helpers count navbar items as
         "body > nav a, body > nav button", so the avatar must not join that set. The full
         display name travels in aria-label/title for screen readers and hover tooltips. -->
    <span th:if="${userInitial != null}"
      class="navbar-avatar inline-flex h-9 w-9 items-center justify-center rounded-full bg-secondary font-serif font-bold text-black"
      th:text="${userInitial}"
      th:attr="aria-label=${userDisplayName}, title=${userDisplayName}"
      role="img">U</span>

    <!-- Logout según rol -->
    <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/logout}" method="POST" class="inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit"
        class="rounded-md bg-primary px-3 py-2 font-medium hover:bg-secondary">
        Logout
      </button>
    </form>

    <form sec:authorize="!hasRole('ADMIN')" th:action="@{/auth/logout}" method="POST" class="inline">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit"
        class="rounded-md bg-primary px-3 py-2 font-medium hover:bg-secondary">
        Logout
      </button>
    </form>
  </div>

  <!-- Usuario NO AUTENTICADO -->
  <div sec:authorize="!isAuthenticated()" class="flex items-center gap-4 text-sm">
    <a th:href="@{/auth/register}"
      class="rounded-md bg-primary px-3 py-2 font-medium hover:bg-secondary">
      Register
    </a>
    <a th:href="@{/auth/login}"
      class="rounded-md bg-secondary px-3 py-2 font-medium hover:bg-primary">
      Login
    </a>
  </div>
</nav>
