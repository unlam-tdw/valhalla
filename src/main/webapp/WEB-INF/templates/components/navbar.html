<nav th:fragment="navbar" xmlns:th="http://www.thymeleaf.org"
  class="flex items-center justify-between bg-gray-900 px-4 text-white shadow">
  <a class="navbar-brand inline-block py-3 text-lg font-semibold hover:text-gray-300"
    th:href="@{/home}">UNLAM</a>
  <div id="navbar-app" th:if="${user != null}" class="flex items-center gap-4 text-sm">
    <a th:href="@{/home}"
      class="rounded-md bg-gray-700 px-3 py-2 font-medium hover:bg-gray-600">
      Home
    </a>
    <a th:href="@{/users}" th:if="${user.role == 'ADMIN'}"
      class="rounded-md bg-gray-700 px-3 py-2 font-medium hover:bg-gray-600">
      Users
    </a>
    <span class="text-gray-300">Signed in as
      <span class="font-medium text-white" th:text="${user.fullName}">name</span>
    </span>
    <form ref="form" @submit.prevent="logout" th:action="@{/logout}" method="POST">
      <button type="submit" :disabled="loading"
        class="rounded-md bg-gray-700 px-3 py-2 hover:bg-gray-600 disabled:opacity-50">
        <span v-if="loading">...</span>
        <span v-else>Logout</span>
      </button>
    </form>
  </div>
</nav>

<script>
  if (document.getElementById('navbar-app')) {
    Vue.createApp({
      data() {
        return { loading: false }
      },
      methods: {
        async logout() {
          this.loading = true;
          const form = this.$refs.form;
          const res = await fetch(form.action, { method: 'POST' });
          if (res.redirected) {
            window.location.href = res.url;
          }
        }
      }
    }).mount('#navbar-app');
  }
</script>
