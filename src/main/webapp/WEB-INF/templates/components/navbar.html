<!-- [MOBILE] flex-wrap: en pantallas angostas el segundo bloque (links) baja a su propia fila
     en vez de forzar scroll horizontal (AC-01/AC-02 de 22-MOBILE).
     [DIS] AC-06: sticky top-0 + z-50 dejan la barra fija durante el scroll en landing y app,
     desde el fragmento único (una sola declaración, todas las páginas). El skip-link del
     landing va después en el orden de fuente y, con el mismo z-50, pinta encima al enfocarse;
     los modales del sitio (navbar-menu z-[1100], detalle del explorador z-[1100]) siguen por
     encima, como los tenía /explore con su sticky propio.
     [MOBILE] La fijeza arranca en md: en un teléfono la barra ocupa una franja de los ~844px
     de viewport y, fija, se comía esa franja para siempre. Debajo de md scrollea con la página.
     [MOBILE] Alto de una fila: la marca baja a py-1.5 con el logo a 36px (md vuelve a py-3 y
     48px) y el cluster anónimo no envuelve (flex-nowrap, gap-x-2), así que la barra mide lo
     que mide su hijo más alto (44px de los links + 12px de aire de la marca = ~52px) en vez
     de las tres filas que armaba el wrap. El ghost de registro se esconde debajo de md: caía
     solo a una segunda línea, huérfano contra el canto derecho, y duplicaba el CTA del hero,
     que 400px más abajo lleva al mismo /auth/register. El aire que ahorra la barra es el que
     dejan el titular y el CTA dentro del primer viewport.
     [NAV] El landing anónimo es la referencia de toda la barra: una sola acción con énfasis
     como mucho, el resto links de texto (.navbar-link en brand.css). Las variantes con sesión
     y admin usan los mismos links, con aria-current="page" en la sección vigente (navSection
     de CurrentUserControllerAdvice). Alto fijo: 48px debajo de md y 72px desde md, el mismo
     valor que publica --nav-h en brand.css para el scroll-padding, el panel del menú y los
     sticky de página. shrink-0: en las páginas app-shell (/explore, import) el body es flex
     columna de alto fijo y, sin él, la barra se aplastaba antes que el mapa. -->
<nav th:fragment="navbar" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  class="z-50 flex shrink-0 flex-wrap items-center justify-between gap-x-4 gap-y-1 bg-black px-4 text-white shadow md:sticky md:top-0">

  <!-- Logo principal: a /admin/home cuando el navbar rinde la variante admin (rol ADMIN
       dentro de /admin/**), a / en el resto. La variante se decide por rol Y por el área que se
       está visitando (CurrentUserControllerAdvice.showAdminNav): un ADMIN en /explore usa el
       navbar de usuario. El color sale del token de marca, declarado en resources/css/brand.css
       y expuesto a Tailwind por el bloque @theme de layouts/base :: head. La clase navbar-brand
       se conserva porque es el hook que leen los tests del navbar. El anillo de foco lo pone
       .focus-ring (--secondary, 4.25:1 sobre el negro de la barra) y no el del navegador, que
       ahí mide 1.07:1: la marca es el segundo tab stop y se enfocaba sin señal. -->
  <a class="navbar-brand inline-flex items-center gap-1.5 py-1.5 font-serif text-xl font-bold text-secondary hover:text-white md:gap-2 md:py-3 focus-ring rounded"
    th:if="${showAdminNav}" th:href="@{/admin/home}">
    <!-- [FLASH] width/height fijos: logo.svg declara 1366x768 y sin width/height el browser
         lo pinta a su tamano intrínseco hasta que Tailwind aplica las clases. Los atributos
         reservan la caja desde el primer frame y las clases siguen mandando: 36px en mobile,
         48px desde md (el alto de la marca en mobile es el que fija el alto de la barra).
         [A11Y] alt vacío a propósito: el texto visible "PlanIt" ya nombra el link y un alt
         "Logo" delante convertía el nombre accesible en "Logo PlanIt". La clase navbar-logo
         es el hook estable de los tests que miden la caja del logo. -->
    <img th:src="@{/images/logo.svg}" alt="" width="48" height="48"
      class="navbar-logo h-9 w-9 object-contain md:h-12 md:w-12" />
    <span>PlanIt</span>
  </a>
  <a class="navbar-brand inline-flex items-center gap-1.5 py-1.5 font-serif text-xl font-bold text-secondary hover:text-white md:gap-2 md:py-3 focus-ring rounded"
    th:unless="${showAdminNav}" th:href="@{/}">
    <img th:src="@{/images/logo.svg}" alt="" width="48" height="48"
      class="navbar-logo h-9 w-9 object-contain md:h-12 md:w-12" />
    <span>PlanIt</span>
  </a>

  <!-- [PPV] "Planes públicos" es el feed /for-you y aparece SIEMPRE en el navbar de usuario,
       con y sin sesion (excepto la variante admin): es la puerta de descubrimiento del producto
       y este es el nombre que comparte con el hero, que lleva a la misma ruta. El link
       duplica en los dos bloques porque el nav es flex de dos hijos (marca + menu) y sacarlo
       romperia el layout; los labels viven en WebPage.getNavbarItems para los E2E. -->
  <!-- [MOBILE] Hamburguesa del menu: solo con sesion (el E2E pinnea que el navbar anonimo NO la
       tiene) y solo por debajo de md. Abre el mismo modal del avatar via data-menu-toggle, asi
       que no hay JS nuevo: los destinos viajan dentro de #navbar-menu (bloque md:hidden).
       Sin texto en el contenido (aria-label) para que getNavbarItems no la cuente en desktop.
       ml-auto empuja el par [hamburguesa][toggle] contra el canto derecho en mobile, ahora
       que el toggle es el ultimo hijo del nav.
       [NAV] Con sesión de usuario la hamburguesa sigue hasta lg, no md: entre 768 y 1023px el
       buscador, los tres links, la campana, el avatar y el toggle no entraban en una fila y la
       barra armaba dos o tres. La variante admin (tres links cortos, sin buscador) entra en
       una fila desde md y conserva ese corte. Ícono sin relleno, como la campana: el cuadrado
       relleno de primario competía con la única acción con énfasis que admite la barra. -->
  <button type="button" id="navbar-menu-btn" data-menu-toggle="navbar-menu"
    sec:authorize="isAuthenticated()"
    class="navbar-menu-btn ml-auto inline-flex h-11 w-11 items-center justify-center rounded-md hover:bg-white/10 focus-ring"
    th:classappend="${showAdminNav} ? 'md:hidden' : 'lg:hidden'"
    aria-label="Abrir menú" aria-haspopup="true" aria-expanded="false" aria-controls="navbar-menu">
    <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Usuario AUTENTICADO: en mobile los links se esconden (van al menu de la hamburguesa).
       md:ml-auto mantiene este cluster contra el canto derecho en desktop aunque el nav suma
       un tercer hijo visible (el form del toggle de tema).
       [NAV] El corte es lg para el usuario y md para el admin (ver la hamburguesa). gap-2 y
       los links con su propio padding repiten el ritmo del cluster anónimo. navbar-actions es
       el hook estable de los tests: la clase de breakpoint cambia según la variante. -->
  <div sec:authorize="isAuthenticated()" class="navbar-actions hidden items-center gap-2 text-sm"
    th:classappend="${showAdminNav} ? 'md:flex md:ml-auto' : 'lg:flex lg:ml-auto'">
    <!-- Front door to the admin panel; the only destination an admin needs, and only while
         inside /admin/**. Outside that area the admin gets the user menu instead. -->
    <!-- [F1] Las etiquetas van en español también en la variante admin: la barra es la misma
         y "Users / Places / Plans" cambiaba de idioma a mitad de la app.
         [NAV] Links de texto como los del landing, no los pills rellenos: tres seguidos
         eran tres acciones primarias. aria-current marca la sección (th:attr con null no
         escribe el atributo); /admin/places/import cuenta como Lugares. -->
    <a th:href="@{/admin/users}" th:if="${showAdminNav}"
      th:attr="aria-current=${navSection == 'admin-users'} ? 'page' : null"
      class="navbar-link focus-ring">
      Usuarios
    </a>
    <a th:href="@{/admin/places}" th:if="${showAdminNav}"
      th:attr="aria-current=${navSection == 'admin-places'} ? 'page' : null"
      class="navbar-link focus-ring">
      Lugares
    </a>
    <a th:href="@{/admin/plans}" th:if="${showAdminNav}"
      th:attr="aria-current=${navSection == 'admin-plans'} ? 'page' : null"
      class="navbar-link focus-ring">
      Planes
    </a>

    <!-- [USEARCH] Buscador de personas con debounce: el script del final del fragment navega a
         /users?q= 300 ms despues de la ultima tecla. Sin boton, para no sumar un item al set que
         pinnean los E2E del navbar; Enter sigue enviando el form nativo. Va antes de "Planes
         públicos" para que el acceso a personas quede a la izquierda del feed. -->
    <form th:action="@{/users}" method="get" role="search" th:unless="${showAdminNav}"
      class="mr-2">
      <label for="navbar-user-search" class="sr-only">Buscar usuarios</label>
      <input id="navbar-user-search" data-user-search name="q" type="search"
        placeholder="Buscar usuarios" autocomplete="off"
        class="w-44 rounded-md border border-gray-600 bg-black px-3 py-2 text-sm text-white placeholder:text-gray-400 focus:border-secondary focus:outline-none" />
    </form>

    <!-- Rutas del usuario común: /for-you es el feed (el home post-login) y /plans su
         listado. /explore es el catálogo. Se muestran en todo el área de usuario, también
         para una sesión ADMIN que la está navegando. [F2] Cada label nombra su destino:
         "Explorar lugares" es solo el catálogo y "Mis planes" solo el listado propio, así dos
         links que van a rutas distintas no se leen como el mismo.
         [NAV] Mismo .navbar-link que el landing anónimo; la sección vigente se marca por
         segmento (navSection): /plans/12 marca "Mis planes" y /for-you no lo toca. -->
    <a th:href="@{/for-you}" th:unless="${showAdminNav}"
      th:attr="aria-current=${navSection == 'for-you'} ? 'page' : null"
      class="navbar-link focus-ring">
      Planes públicos
    </a>
    <a th:href="@{/explore}" th:unless="${showAdminNav}"
      th:attr="aria-current=${navSection == 'explore'} ? 'page' : null"
      class="navbar-link focus-ring">
      Explorar lugares
    </a>
    <a th:href="@{/plans}" th:unless="${showAdminNav}"
      th:attr="aria-current=${navSection == 'plans'} ? 'page' : null"
      class="navbar-link focus-ring">
      Mis planes
    </a>

    <!-- [NOTIF] AC-05: campana con badge de no-leidas. El numero viaja en data-notifications-count
         y se pinta por CSS (::after con attr(), brand.css), no como nodo de texto: el pinneo de
         WebPage.getNavbarItems toma allTextContents y un "3" suelto cambiaria el set esperado de
         todos los E2E del navbar; el pseudo-elemento es texto generado y no entra ahi. El advice
         global (CurrentUserControllerAdvice.unreadNotificationCount) resuelve la cuenta por
         request: marcar desde la pagina descuenta en el render del redirect, sin JS. -->
    <a th:href="@{/notifications}" id="navbar-notifications" data-testid="navbar-notifications"
      aria-label="Notificaciones"
      class="navbar-notifications relative inline-flex h-11 w-11 items-center justify-center rounded-md hover:bg-white/10 focus-ring"
      th:attr="data-notifications-count=${unreadNotificationCount}">
      <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </a>

    <!-- [PROF] El avatar pasa de <span> a <button>: abre el menú modal del navbar
         (components/navbar-menu.html, renderizado fuera del <nav> en base.html). Muestra el
         avatarUrl vigente del usuario (userAvatarUrl, resuelto por CurrentUserControllerAdvice)
         y cae a la inicial si no hay: actualizar el perfil se refleja aca en el render del
         redirect, sin JS. La inicial va en un span interno, no en th:text directo del
         <button>: eso reemplazaria todo el contenido del nodo (incluido el <img>). La
         geometría del círculo la manda el botón (overflow-hidden, misma defensa contra el
         max-width del preflight que los botones del avatar-picker). El nombre completo sigue
         viajando en aria-label/title para lectores de pantalla y tooltips. El logout ya no
         vive en el navbar: está en el modal (navbar-menu), así que los helpers E2E que
         pinnearon items no ven un "Logout" suelto que desapareció. -->
    <!-- [C1] Campana y avatar a 44px (h-11 w-11): eran los dos únicos controles del navbar
         debajo del objetivo tocable de WCAG 2.2 AA que ya cumplía el resto (hamburguesa, toggle
         de tema y CTA). El ícono sigue en 20px, centrado, así el botón crece sin que el dibujo
         engorde. -->
    <button type="button" data-menu-toggle="navbar-menu" id="navbar-avatar"
      class="navbar-avatar inline-flex h-11 w-11 items-center justify-center overflow-hidden rounded-full bg-secondary font-serif font-bold text-black hover:ring-2 hover:ring-white/60"
      th:if="${userInitial != null}"
      th:attr="aria-label=${userDisplayName}, title=${userDisplayName}"
      aria-haspopup="true" aria-expanded="false" aria-controls="navbar-menu">
      <span class="relative inline-flex h-full w-full items-center justify-center">
        <!-- La inicial va siempre: si la foto no responde, el onerror se borra a si mismo y el
             disco ya tiene su pareja dibujada underneath. Evita el icono roto en el navbar. -->
        <span th:text="${userInitial}">U</span>
        <img th:if="${userAvatarUrl != null}" th:src="${userAvatarUrl}" alt=""
          onerror="this.remove()" class="absolute inset-0 h-full w-full object-cover" />
      </span>
    </button>

    <!-- [PROF+THEME] El toggle de tema NO vive en este bloque: es un form hijo directo del
         <nav> (mas abajo) para que en mobile quede en la fila del logo, pegado a la
         hamburguesa. El item "Tema" del modal se retiro. -->
  </div>

  <!-- Usuario NO AUTENTICADO: sin hamburguesa (decision fijada en PublicPlansListE2E). Los links
       van en una sola fila junto al logo en TODOS los anchos: flex-nowrap + gap-x-2 en el cluster
       (la marca ya viene recortada a 36px) alcanzan para que "Planes públicos" e "Iniciar sesión"
       entren a la derecha de "PlanIt" en 390px sin envolver. "Planes públicos" sigue sin sesion:
       el feed es publico y es la unica puerta de descubrimiento que el anonimo tiene, y ese es el
       nombre con el que el hero llama a la misma ruta (una ruta, un nombre). "Crear cuenta gratis"
       se oculta debajo de md: era el único control que caía a una segunda línea, huérfano contra el
       canto derecho, y duplicaba el CTA del hero (mismo /auth/register, 400px más abajo en el primer
       viewport). El display:none va en un <span> envoltorio porque .btn-ghost declara display en
       brand.css sin capa y le gana a la utilidad hidden. En desktop el set no cambia. El anonimo
       no tiene ningun control de tema: sin sesion, el modo sigue al sistema ([THEME]).
       [NAV] Las utilidades que cada link repetía (min-h-11, text-white/90, subrayado en hover)
       viven una sola vez en .navbar-link de brand.css, compartida con las variantes con sesión. -->
  <div sec:authorize="!isAuthenticated()"
    class="ml-auto flex flex-nowrap items-center justify-end gap-x-2 text-sm">
    <a th:href="@{/for-you}"
      th:attr="aria-current=${navSection == 'for-you'} ? 'page' : null"
      class="navbar-link focus-ring">
      Planes públicos
    </a>
    <a th:href="${#strings.isEmpty(currentPath)} ? @{/auth/login} : @{/auth/login(redirect=${currentPath})}"
      class="navbar-link focus-ring">
      Iniciar sesión
    </a>
    <span class="hidden md:inline-flex">
      <a th:href="@{/auth/register}"
        class="btn-ghost whitespace-nowrap focus-ring">
        Crear cuenta gratis
      </a>
    </span>

  </div>

  <!-- [USEARCH] El debounce vive en /js/user-search.js: comparte el input de escritorio y el del
       menú mobile, que es un hermano posterior del nav, así que el script carga con defer y
       consulta el DOM cuando ya están los dos. -->
  <script th:src="@{/js/user-search.js}" defer></script>
  <!-- [PROF+THEME] Toggle de tema: solo con sesion iniciada. Es un form POST a
       /profile/theme (CSRF incluido) porque la preferencia manda sobre localStorage: un
       toggle que solo escriba el storage se revierte en la proxima carga. El hidden del
       tema arranca en el opuesto del modo preferido para que el form funcione sin JS; el
       script de layouts/base lo recalcula al enviar desde data-theme, que es el modo real
       ya aplicado. El redirect vuelve a la pagina actual (admin incluido) y el controller
       lo valida. Hijo directo del nav y order-last: en mobile queda en la fila del logo,
       pegado a la hamburguesa, y en desktop md:order-none lo deja junto al cluster de la
       derecha. El sr-only es el nombre accesible y el texto que leen los helpers E2E.
       [NAV] El corte del order sigue al del cluster (lg usuario, md admin). El botón es un
       ícono de 44px sin relleno, gemelo de la campana: el relleno de primario lo volvía un CTA. -->
  <form th:action="@{/profile/theme}" method="POST" id="navbar-theme-form"
    sec:authorize="isAuthenticated()" class="order-last"
    th:classappend="${showAdminNav} ? 'md:order-none' : 'lg:order-none'">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="theme" id="navbar-theme-value"
      th:value="${userThemePreference == 'dark'} ? 'light' : 'dark'">
    <input type="hidden" name="redirect" th:value="${themeRedirectUrl}">
    <button type="submit" data-theme-toggle title="Cambiar tema"
      class="theme-toggle inline-flex h-11 w-11 items-center justify-center rounded-md hover:bg-white/10 focus-ring">
      <svg class="theme-icon-moon h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
      <svg class="theme-icon-sun h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
      <span class="sr-only">Cambiar tema</span>
    </button>
  </form>
</nav>
