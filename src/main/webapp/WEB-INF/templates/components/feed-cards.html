<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

  <!-- [PAGE] Markup compartido por la pagina completa de /for-you y el endpoint parcial
       (GET /for-you?partial): el script de "Cargar mas" reutiliza exactamente estas cards y no
       duplica el articulo. El wrapper data-feed-page lleva los datos de la ventana siguiente;
       la pagina completa usa el mismo fragmento, asi el JS y el fallback sin JS no divergen. -->
  <body>
    <th:block
      th:fragment="feedPage(publicPlans, canBookmark, feedCurrentUrl, currentPath, hasMore, nextPageUrl, nextPartialUrl)">
      <div data-feed-page
        th:attr="data-has-more=${hasMore},data-next-page-url=${nextPageUrl},data-next-partial-url=${nextPartialUrl}">
        <div th:if="${!publicPlans.isEmpty()}" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"
          data-feed-grid>
          <!-- La card entera se siente clickeable: el body ya linkea a la vista publica, y el
               hover con lift + sombra mas fuerte comunica la accion antes de llegar al CTA. -->
          <article th:each="plan : ${publicPlans}"
            class="relative flex cursor-pointer flex-col overflow-hidden rounded-lg bg-white shadow-md transition duration-200 hover:-translate-y-1 hover:shadow-xl">
            <!-- [MARK] Guardar para clonar despues. Va fuera del <a> porque un form adentro de un
                 anchor es HTML invalido; absoluto arriba a la derecha del cover. Sin sesion no se
                 renderiza (AC-05) y el returnTo conserva los filtros del feed. -->
            <div class="absolute right-3 top-3 z-10 flex items-center gap-2">
              <button type="button" data-share-plan
                th:attr="data-share-url=@{/plans/{id}/public(id=${plan.id})}"
                aria-label="Compartir plan" title="Compartir plan"
                class="inline-flex h-9 w-9 items-center justify-center rounded-full bg-white/90 text-gray-600 shadow ring-1 ring-black/10 transition hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><polyline points="16 6 12 2 8 6" /><line x1="12" x2="12" y1="2" y2="15" /></svg>
              </button>
              <div th:if="${canBookmark}">
                <div th:replace="~{components/bookmark-button :: toggle(${plan.id}, ${plan.bookmarked}, ${feedCurrentUrl})}"></div>
              </div>
            </div>
            <!-- [DIS] 23-DIS: el link de la card es un overlay. HTML no admite <a> dentro de <a>
                 y el nombre del autor linkeaba a su perfil ADENTRO del link de la card: el parser
                 la partia en fragmentos. Ahora el destino es un <a> absoluto que cubre la card
                 (mismo href, nombre accesible sr-only con el nombre del plan) y lo que es
                 interactivo de verdad (Guardar, autor, fila de acciones) queda por encima
                 con z-10. -->
            <a th:href="@{/plans/{id}/public(id=${plan.id})}" class="absolute inset-0 z-0">
              <span class="sr-only" th:text="${plan.name}">Ver plan</span>
            </a>
            <div class="flex flex-1 flex-col">
              <!-- Cover generico del plan (id -> /images/plans/cover-N.svg). A futuro, si Plan
                   trae imageUrl propia, th:src cambia a ${plan.imageUrl} sin tocar el resto. -->
              <img th:src="${plan.cover}" th:alt="${plan.name}" loading="lazy"
                class="h-40 w-full border-b border-gray-100 object-cover" />
              <div class="flex flex-1 flex-col p-5">
                <h3 class="text-lg font-semibold text-gray-900"
                  th:text="${plan.name}">Nombre del plan</h3>
                <p class="mt-1 line-clamp-3 text-sm text-gray-600" th:text="${plan.description}">
                  Descripción
                </p>
                <div class="mt-auto space-y-1 pt-3 text-xs text-gray-500">
                  <p th:if="${plan.eventDate != null}">
                    Fecha: <span th:text="${plan.eventDate}">0000-00-00</span>
                  </p>
                  <p>
                    <span th:text="${plan.placeCount}">0</span>
                    lugar(es) en el itinerario
                  </p>
                  <!-- [DIS] AC-04 (23-DIS): "Por {autor}" en una sola linea. El <p> es fila:
                       "Por" no encoge, el link trunca con elipsis y el title lleva el nombre
                       completo (hover y lectura de pantalla leen el nombre entero). -->
                  <p th:if="${!#strings.isEmpty(plan.administratorName)}" data-testid="plan-card-author"
                    class="flex min-w-0 items-baseline gap-1">
                    <span class="shrink-0">Por</span>
                    <!-- [PROF] AC-22: el nombre del autor linkea a su perfil publico (siempre
                         tiene id: la tarjeta publica sale de un plan real con dueno). -->
                    <a th:href="@{/profile/{id}(id=${plan.administratorId})}"
                      class="relative z-10 truncate text-blue-600 hover:underline"
                      th:title="${plan.administratorName}"
                      th:text="${plan.administratorName}">Administrador</a>
                  </p>
                  <!-- [CAL] Indicador de calificaciones de la tarjeta (16-CAL.md, AC-10): el mismo
                       agregado de la vista publica, en version mini. Solo lectura: el vote vive en
                       la vista del plan. Sin calificaciones el fragment no renderiza nada. -->
                  <p th:if="${plan.ratingAverage != null}" class="rating-line flex items-center gap-1.5">
                    <th:block th:replace="~{components/rating :: indicator(${plan.ratingAverage}, ${plan.ratingCount}, 'text-base', 'text-xs', true)}"></th:block>
                  </p>
                </div>
              </div>
            </div>

            <!-- Acciones de la tarjeta: clonar como base propia (los planes propios no llegan
                 aca, asi que no hay CTA de edicion en el feed). El mismo CTA con y sin sesion
                 [PPV]: logueado ejecuta el clone via form, anonimo va al login con la vuelta
                 al feed (?redirect=, el mismo mecanismo que el navbar) y clona al volver.
                 relative z-10: queda por encima del overlay de la card, si no el <a> absoluto
                 le roba el click (lo descubrio el E2E de clonacion del feed).
                 El literal del CTA no se repite aca: los tests de integracion cuentan esa
                 cadena por plan listado y un comentario la duplicaria. -->
            <div class="relative z-10 flex gap-2 border-t border-gray-100 p-3">
              <!-- El CTA de clonar = [CLO] POST /plans/{id}/clone: copia el plan como tuyo y caes en
                   tu copia editable. Con CSRF via form nativo, como /plans/join. -->
              <form sec:authorize="isAuthenticated()"
                th:action="@{/plans/{id}/clone(id=${plan.id})}" method="POST" class="flex-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit"
                  class="inline-flex w-full cursor-pointer items-center justify-center gap-2 rounded-md bg-primary px-4 py-2 font-medium text-white transition hover:bg-secondary">
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                  </svg>
                  Clonar Plan
                </button>
              </form>

              <a sec:authorize="!isAuthenticated()"
                th:href="${#strings.isEmpty(currentPath)} ? @{/auth/login} : @{/auth/login(redirect=${currentPath})}"
                class="inline-flex flex-1 items-center justify-center gap-2 rounded-md bg-primary px-4 py-2 font-medium text-white transition hover:bg-secondary">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                </svg>
                Clonar Plan
              </a>
            </div>
          </article>
        </div>

        <!-- [PAGE] Fallback sin JavaScript: es un link real a la pagina siguiente completa. El
             script intercepta el click, pide el mismo destino con `partial` y agrega las cards. -->
        <div th:if="${hasMore}" data-feed-more class="mt-6 flex justify-center">
          <a data-load-more th:href="${nextPageUrl}"
            th:attr="data-load-more-url=${nextPartialUrl}"
            class="inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 font-medium text-white transition hover:bg-secondary">
            Cargar más
          </a>
        </div>
      </div>
    </th:block>
  </body>
</html>
