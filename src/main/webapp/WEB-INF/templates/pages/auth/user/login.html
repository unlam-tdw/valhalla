<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Valhalla</title>
</head>
<body>
    <main>
        <h1>Iniciar Sesión</h1>

        <div th:if="${param.error}" style="color: red;">
            <p>Email o contraseña inválidos.</p>
        </div>

        <div th:if="${param.logout}" style="color: green;">
            <p>Has cerrado sesión con éxito.</p>
        </div>

        <form th:action="@{/auth/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div>
                <label for="username">Correo Electrónico:</label>
                <input type="email" id="username" name="username" required autofocus />
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required />
            </div>

            <button type="submit">Ingresar</button>
        </form>

        <nav>
            <p><a th:href="@{/auth/forgot-password}">¿Olvidaste tu contraseña?</a></p>
            <p>¿No tienes cuenta? <a th:href="@{/auth/register}">Regístrate aquí</a></p>
        </nav>
    </main>
</body>
</html>
