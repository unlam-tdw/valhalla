<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Valhalla</title>
</head>
<body>
    <main>
        <h1>Recuperar Contraseña</h1>
        <p>Ingresa tu correo electrónico registrado para generar una nueva clave de acceso.</p>

        <div th:if="${errorMessage}" style="color: red;">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/auth/recover}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required autofocus />
            </div>

            <button type="submit">Recuperar acceso</button>
        </form>

        <nav>
            <p><a th:href="@{/auth/login}">Volver al inicio de sesión</a></p>
        </nav>
    </main>
</body>
</html>
