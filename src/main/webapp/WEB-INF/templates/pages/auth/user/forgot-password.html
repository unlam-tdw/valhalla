<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Recuperar Contraseña - Valhalla')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex flex-1 items-center justify-center p-4">
    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <h1 class="mb-2 text-2xl font-semibold text-gray-900">Recuperar Contraseña</h1>
      <p class="mb-6 text-sm text-gray-600">
        Ingresá tu correo electrónico registrado para generar una nueva clave de acceso.
      </p>

      <p th:if="${errorMessage}" class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700"
        th:text="${errorMessage}"></p>

      <form th:action="@{/auth/recover}" th:object="${recoverPasswordRequest}" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mt-4">
          <label for="email" class="mb-1 block text-sm font-medium text-gray-700">Correo Electrónico</label>
          <input type="email" id="email" th:field="*{email}" autocomplete="username" required autofocus
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 block text-sm text-red-600"></span>
        </div>

        <button id="btn-recover" type="submit"
          class="mt-6 w-full rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700">
          Recuperar acceso
        </button>
      </form>

      <p class="mt-6 text-sm text-gray-600">
        <a th:href="@{/auth/login}" class="text-blue-600 hover:underline">Volver al inicio de sesión</a>
      </p>
    </div>
  </main>

</body>

</html>
