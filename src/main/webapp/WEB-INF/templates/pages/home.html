<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Home')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex-1 flex flex-col items-center justify-center gap-4 p-4">
    <h1 class="text-3xl font-semibold text-gray-900">Welcome to Taller Web 1</h1>

    <p class="text-gray-600">
      You are signed in as <span class="font-medium text-gray-900" th:text="${user.fullName}">name</span>
      <span th:if="${user.role != null}"
        class="ml-2 rounded-full bg-gray-200 px-3 py-1 text-xs font-medium text-gray-700"
        th:text="${user.role}">ROLE</span>
    </p>

    <div id="session-clock-app" th:attr="data-login-time=${loginTime}"
      class="rounded-lg bg-white px-4 py-3 text-sm text-gray-700 shadow-md">
      Signed in for <span class="font-medium text-gray-900">{{ elapsed }}</span>
    </div>

    <a th:href="@{/home}" class="text-blue-600 hover:underline">Reload</a>

    <script>
      Vue.createApp({
        data() {
          return {
            elapsed: '0:00'
          }
        },
        mounted() {
          const loginTime = Number(document.getElementById('session-clock-app').dataset.loginTime);
          const pad = (n) => n < 10 ? '0' + n : '' + n;
          const update = () => {
            const total = Math.max(0, Date.now() - loginTime);
            let seconds = Math.floor(total / 1000);
            const hours = Math.floor(seconds / 3600);
            seconds %= 3600;
            const minutes = Math.floor(seconds / 60);
            seconds %= 60;
            this.elapsed = (hours > 0 ? pad(hours) + ':' : '') + pad(minutes) + ':' + pad(seconds);
          };
          setInterval(update, 1000);
          update();
        }
      }).mount('#session-clock-app');
    </script>
  </main>

</body>

</html>
