<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/base :: head('Mi calendario')}"></head>
<body th:replace="~{layouts/base :: layout(~{::main})}">
  <main class="min-w-0 flex-1 p-3 sm:p-4">
    <div class="mx-auto max-w-5xl">
      <div class="mb-3 flex items-center justify-between gap-3">
        <h1 class="text-xl font-semibold text-gray-900 sm:text-2xl">Mi calendario</h1>
        <a th:href="@{/plans}" class="inline-flex min-h-11 items-center rounded-md border border-gray-300 px-3 text-sm text-gray-700 hover:bg-gray-100">Mis planes</a>
      </div>
      <div class="grid min-w-0 gap-3 md:grid-cols-[minmax(0,1fr)_18rem]">
        <section class="min-w-0 overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm" aria-label="Calendario mensual">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-gray-200 px-3 py-2">
            <h2 class="text-lg font-semibold capitalize text-gray-900" th:text="${monthLabel}">Mes</h2>
            <nav class="flex items-center gap-1" aria-label="Cambiar mes">
              <a th:href="@{/plans/calendar(month=${previousMonth})}" class="inline-flex h-11 w-11 items-center justify-center rounded-md border border-gray-300 text-gray-700 hover:bg-gray-100" aria-label="Mes anterior">←</a>
              <a th:href="@{/plans/calendar}" class="inline-flex h-11 items-center justify-center rounded-md border border-gray-300 px-3 text-sm text-gray-700 hover:bg-gray-100">Hoy</a>
              <a th:href="@{/plans/calendar(month=${nextMonth})}" class="inline-flex h-11 w-11 items-center justify-center rounded-md border border-gray-300 text-gray-700 hover:bg-gray-100" aria-label="Mes siguiente">→</a>
            </nav>
          </div>
          <div class="grid grid-cols-7 border-b border-gray-200 bg-gray-50 text-center text-xs font-medium text-gray-600">
            <div th:each="label : ${ {'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'} }" class="py-2" th:text="${label}">Lun</div>
          </div>
          <div class="grid grid-cols-7">
            <div th:each="day : ${days}" class="min-w-0 border-b border-r border-gray-200" th:classappend="${day.currentMonth} ? 'bg-white' : 'bg-gray-50'">
              <a th:href="@{/plans/calendar(month=${day.date.toString().substring(0,7)},date=${day.date})}"
                th:attr="aria-current=${day.date.equals(selectedDate)} ? 'date' : null,aria-label=|${#temporals.format(day.date, 'dd/MM/yyyy')}: ${#lists.size(day.plans)} planes|"
                class="flex h-[clamp(44px,8svh,72px)] flex-col items-center justify-center gap-0.5 text-gray-700 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-[-2px]"
                th:classappend="${day.date.equals(selectedDate)} ? 'ring-2 ring-inset ring-primary' : ''">
                <time th:datetime="${day.date}" th:text="${day.date.dayOfMonth}" class="inline-flex h-6 w-6 items-center justify-center rounded-full text-sm" th:classappend="${day.today} ? 'bg-primary text-white' : ''">1</time>
                <span th:unless="${#lists.isEmpty(day.plans)}" class="text-[10px] font-medium text-primary sm:text-xs">
                  <span th:text="${#lists.size(day.plans)}">1</span><span class="hidden sm:inline" th:text="${#lists.size(day.plans) == 1} ? ' plan' : ' planes'"> plan</span><span class="sm:hidden" aria-hidden="true"> ●</span>
                </span>
              </a>
            </div>
          </div>
        </section>
        <section class="min-w-0 self-start rounded-lg border border-gray-200 bg-white p-3 shadow-sm" aria-label="Planes del día seleccionado">
          <h2 class="mb-2 font-semibold capitalize text-gray-900" th:text="${selectedDateLabel}">Planes del día</h2>
          <p th:if="${#lists.isEmpty(selectedPlans)}" class="text-sm text-gray-600">No tenés planes para este día.</p>
          <div class="max-h-[min(40svh,20rem)] space-y-2 overflow-y-auto">
            <a th:each="plan : ${selectedPlans}" th:href="@{/plans/{id}(id=${plan.id})}" class="flex min-h-11 items-center gap-3 break-words rounded-md border border-gray-200 p-3 text-sm text-primary hover:bg-gray-100">
              <time th:if="${plan.eventTime != null}" th:text="${#temporals.format(plan.eventTime, 'HH:mm')}" class="shrink-0 text-xs text-gray-600">10:00</time>
              <span class="min-w-0 break-words" th:text="${plan.name}">Plan</span>
            </a>
          </div>
          <details th:unless="${#lists.isEmpty(undatedPlans)}" class="mt-3 border-t border-gray-200 pt-2">
            <summary class="cursor-pointer py-2 text-sm font-medium text-gray-700">Planes sin fecha</summary>
            <div class="max-h-40 overflow-y-auto">
              <a th:each="plan : ${undatedPlans}" th:href="@{/plans/{id}(id=${plan.id})}" th:text="${plan.name}" class="block break-words py-3 text-sm text-primary hover:underline">Plan</a>
            </div>
          </details>
        </section>
      </div>
      <p th:unless="${hasPlans}" class="mt-3 text-sm text-gray-600">Todavía no tenés planes. Creá uno desde Mis planes o unite con un código.</p>
    </div>
  </main>
</body>
</html>
