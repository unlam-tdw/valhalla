<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

  <!-- [SURPRISE] Botón "Sorprendeme" del feed /for-you: preguntas mínimas y plan privado. -->
  <head th:replace="~{layouts/base :: head('Sorprendeme - PlanIt')}"></head>

  <body th:replace="~{layouts/base :: layout(~{::main})}">
    <main class="flex-1 p-4">
      <div class="mx-auto max-w-xl">
        <div class="rounded-xl bg-white p-6 shadow-md">
          <h1 class="text-2xl font-semibold text-gray-900">Sorprendeme</h1>
          <p class="mt-1 text-sm text-gray-600">
            Decime qué presupuesto tenés y una fecha, y te armo un plan para empezar.
          </p>

          <form method="post" th:action="@{/plans/surprise}" th:object="${surpriseForm}" class="mt-6 space-y-4">
            <label class="block text-sm font-medium text-gray-700">
              Presupuesto máximo por persona
              <input type="number" step="0.01" min="0" required th:field="*{budget}"
                class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2"
                placeholder="20000" />
            </label>

            <label class="block text-sm font-medium text-gray-700">
              Fecha
              <input type="date" required th:field="*{date}"
                class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
            </label>

            <label class="block text-sm font-medium text-gray-700">
              ¿Cuántas personas?
              <input type="number" min="1" th:field="*{people}"
                class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2"
                placeholder="2" />
            </label>

            <label class="block text-sm font-medium text-gray-700">
              Estilo
              <select th:field="*{style}" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2">
                <option value="gastronomia">Gastronomía</option>
                <option value="cultura">Cultura</option>
                <option value="aire_libre">Aire libre</option>
                <option value="mixto">Mixto</option>
              </select>
            </label>

            <button type="submit"
              class="w-full rounded-md bg-primary px-4 py-2 font-medium text-white transition hover:bg-secondary">
              Generar mi plan
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
