<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Crear plan')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex flex-1 items-center justify-center p-4">
    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
      <h1 class="mb-6 text-2xl font-semibold text-gray-900">Crear plan</h1>

      <p th:if="${error}" class="mb-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700" th:text="${error}">
        Error
      </p>

      <!-- Re-rendered after a rejected PUT as well as after a rejected POST: with planId in the
           model the form must retry the update instead of creating a second plan. -->
      <form th:action="${planId != null} ? @{/plans/{id}(id=${planId})} : @{/plans}" th:object="${plan}"
        method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="_method" th:if="${planId != null}" value="PUT" />

        <div class="mt-4">
          <label for="name" class="mb-1 block text-sm font-medium text-gray-700">Nombre del plan</label>
          <input type="text" id="name" th:field="*{name}" placeholder="Ej: Salida por Buenos Aires" required
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
            Plan name is required
          </p>
        </div>

        <div class="mt-4">
          <label for="description" class="mb-1 block text-sm font-medium text-gray-700">Descripción</label>
          <textarea id="description" th:field="*{description}" rows="4"
            placeholder="Contá brevemente de qué se trata el plan"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="mt-4">
          <label for="eventDate" class="mb-1 block text-sm font-medium text-gray-700">Fecha</label>
          <input type="date" id="eventDate" th:field="*{eventDate}"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>

        <div class="mt-4">
          <label for="eventTime" class="mb-1 block text-sm font-medium text-gray-700">Hora</label>
          <input type="time" id="eventTime" th:field="*{eventTime}"
            class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>

        <div class="mt-4 flex items-center gap-2">
          <input type="checkbox" id="isPublic" th:field="*{isPublic}"
            class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />
          <label for="isPublic" class="text-sm font-medium text-gray-700">Hacer público este plan</label>
        </div>

        <div class="mt-6 flex justify-end gap-2">
          <a th:href="@{/plans}"
            class="rounded-md bg-gray-200 px-4 py-2 font-medium text-gray-700 transition hover:bg-gray-300">
            Cancelar
          </a>
          <button type="submit"
            class="rounded-md bg-blue-600 px-4 py-2 font-medium text-white transition hover:bg-blue-700">
            Crear plan
          </button>
        </div>
      </form>
    </div>
  </main>

</body>

</html>
