<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis planes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
        }

        .create-button {
            padding: 11px 20px;
            border-radius: 7px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
        }

        .plans {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .plan {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-info h2 {
            font-size: 20px;
            margin-bottom: 7px;
        }

        .plan-description {
            color: #666;
            margin-bottom: 10px;
        }

        .plan-date {
            font-size: 14px;
            color: #777;
        }

        .visibility {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 9px;
            border-radius: 5px;
            background-color: #eee;
            font-size: 13px;
        }

        .detail-button {
            padding: 9px 15px;
            border-radius: 7px;
            background-color: #e5e7eb;
            color: #222;
            text-decoration: none;
        }

        .empty {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Encabezado -->

    <div class="header">

        <div>
            <h1>Mis planes</h1>

            <p class="subtitle">
                Todos tus planes creados.
            </p>
        </div>

        <a href="/planes/crear" class="create-button">
            Crear plan
        </a>

    </div>


    <!-- Lista de planes -->

    <div class="plans">

        <div
                class="plan"
                th:each="plan : ${plans}">

            <div class="plan-info">

                <h2 th:text="${plan.name}">
                    Nombre del plan
                </h2>

                <p
                        class="plan-description"
                        th:text="${plan.description}">
                    Descripción del plan
                </p>

                <p class="plan-date">

                    Fecha:
                    <span th:text="${plan.eventDate}">
                        00/00/0000
                    </span>

                </p>

                <span th:text="${plan.isPublic != null and plan.isPublic ? 'Público' : 'Privado'}"></span>

            </div>


            <!-- Ver detalle -->

            <a
                    class="detail-button"
                    th:href="@{/planes/{id}(id=${plan.IdPlan})}">

                Ver detalle

            </a>

        </div>

    </div>


    <!-- Cuando no existen planes -->

    <div
            class="empty"
            th:if="${#lists.isEmpty(plans)}">

        <p>
            Todavía no tenés ningún plan creado.
        </p>

    </div>

</div>

</body>
</html>
```
