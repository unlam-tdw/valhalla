<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head(${isEdit} ? 'Edit Place' : 'New Place')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex-1 flex items-center justify-center p-4">
    <!-- Leaflet vendorizado (1.9.4), igual que el importador: nunca un CDN. -->
    <link rel="stylesheet" th:href="@{/css/leaflet.css}" />

    <div id="place-form-app" class="w-full max-w-2xl rounded-lg bg-white p-8 shadow-md"
      th:attr="data-name=${placeForm.name},data-category=${placeForm.category},data-description=${placeForm.description},data-address=${placeForm.address},data-image-url=${placeForm.imageUrl},data-latitude=${placeForm.latitude},data-longitude=${placeForm.longitude},data-opening-hours=${placeForm.openingHours},data-phone=${placeForm.phone},data-website=${placeForm.website},data-error=${error}">
      <h3 class="mb-2 text-2xl font-semibold text-gray-900"
        th:text="${isEdit} ? 'Edit Place' : 'New Place'">Form Title</h3>
      <hr class="mb-6 border-gray-200">

      <form ref="form" @submit.prevent="submit"
        th:action="${isEdit} ? @{/admin/places/{id}(id=${placeId})} : @{/admin/places}"
        method="POST">
        <input th:if="${isEdit}" type="hidden" name="_method" value="PUT" />

        <div class="mt-4">
          <label for="name" class="mb-1 block text-sm font-medium text-gray-700">Name</label>
          <input v-model="name" id="name" name="name" type="text" required
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>

        <div class="mt-4">
          <label for="category" class="mb-1 block text-sm font-medium text-gray-700">Category</label>
          <select v-model="category" id="category" name="category" required
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none">
            <option value="" disabled>Select category</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">CATEGORY</option>
          </select>
        </div>

        <div class="mt-4">
          <label for="description" class="mb-1 block text-sm font-medium text-gray-700">Description</label>
          <textarea v-model="description" id="description" name="description" rows="3"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none"></textarea>
        </div>

        <div class="mt-4">
          <label for="address" class="mb-1 block text-sm font-medium text-gray-700">Address</label>
          <input v-model="address" id="address" name="address" type="text"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>

        <div class="mt-4">
          <label for="imageUrl" class="mb-1 block text-sm font-medium text-gray-700">Image URL</label>
          <input v-model="imageUrl" id="imageUrl" name="imageUrl" type="url"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          <p class="text-xs text-gray-500">
            Optional: leave it empty and the view falls back to /images/place-placeholder.svg
          </p>
        </div>

        <div class="flex gap-4">
          <div class="mt-4 flex-1">
            <label for="latitude" class="mb-1 block text-sm font-medium text-gray-700">Latitude</label>
            <input v-model="latitude" id="latitude" name="latitude" type="number" step="any"
              class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          </div>
          <div class="mt-4 flex-1">
            <label for="longitude" class="mb-1 block text-sm font-medium text-gray-700">Longitude</label>
            <input v-model="longitude" id="longitude" name="longitude" type="number" step="any"
              class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          </div>
        </div>

        <!-- El punto se elige en el mapa o se tipea arriba: el mapa solo escribe lat/long. -->
        <div id="place-map" class="mt-4 h-56 w-full rounded-md border border-gray-300"></div>

        <div class="mt-4">
          <label for="openingHours" class="mb-1 block text-sm font-medium text-gray-700">Opening Hours</label>
          <input v-model="openingHours" id="openingHours" name="openingHours" type="text"
            class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
        </div>

        <div class="flex gap-4">
          <div class="mt-4 flex-1">
            <label for="phone" class="mb-1 block text-sm font-medium text-gray-700">Phone</label>
            <input v-model="phone" id="phone" name="phone" type="tel"
              class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          </div>
          <div class="mt-4 flex-1">
            <label for="website" class="mb-1 block text-sm font-medium text-gray-700">Website</label>
            <input v-model="website" id="website" name="website" type="url"
              class="mb-1 w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:outline-none" />
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button type="submit" id="btn-create" :disabled="loading"
            class="flex-1 rounded-md bg-blue-600 py-2 font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
            <span v-if="loading">Saving...</span>
            <span v-else th:text="${isEdit} ? 'Update' : 'Create'">Save</span>
          </button>
          <a th:href="@{/admin/places}"
            class="flex-1 rounded-md bg-gray-200 py-2 text-center font-medium text-gray-700 transition hover:bg-gray-300">
            Cancel
          </a>
        </div>

        <p v-if="error" class="alert alert-danger my-4 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700">{{ error }}</p>
      </form>
    </div>

    <!-- Leaflet vendorizado (1.9.4): mismo motivo que la hoja de estilos. -->
    <script th:src="@{/js/leaflet.js}"></script>

    <script>
      const { createApp, ref, onMounted } = Vue;

      createApp({
        setup() {
          const data = document.getElementById('place-form-app').dataset;
          const field = (key) => ref(data[key] || '');
          const loading = ref(false);
          const form = ref(null);
          const submit = () => { loading.value = true; form.value.submit(); };
          const latitude = field('latitude');
          const longitude = field('longitude');

          // De una sola direccion: el mapa escribe lat/long; tipearlas no mueve el marcador.
          onMounted(() => {
            const seeded = latitude.value !== '' && longitude.value !== '' &&
              Number.isFinite(Number(latitude.value)) && Number.isFinite(Number(longitude.value));
            const start = seeded ? L.latLng(Number(latitude.value), Number(longitude.value)) : null;
            const map = L.map('place-map', {
              center: start || [-34.6037, -58.3816],
              zoom: start ? 16 : 13
            });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            let marker = null;
            const dropPin = (position) => {
              if (marker) {
                marker.setLatLng(position);
                return;
              }
              marker = L.marker(position, { draggable: true }).addTo(map);
              marker.on('dragend', () => movePin(marker.getLatLng()));
            };
            const movePin = (position) => {
              latitude.value = position.lat.toFixed(6);
              longitude.value = position.lng.toFixed(6);
              dropPin(position);
            };
            // El pin del pre-llenado se planta sin tocar los inputs: el valor tipeado o el query
            // param se muestran tal cual llegaron.
            if (start) dropPin(start);
            map.on('click', (event) => movePin(event.latlng));
            /* El compilador de Tailwind corre diferido: sin esto el mapa se crea midiendo 0 y
               queda centrado fuera de lugar (la misma razon que en /explore y el importador). */
            new ResizeObserver(() => map.invalidateSize()).observe(map.getContainer());
            requestAnimationFrame(() => map.invalidateSize());
          });

          return {
            name: field('name'), category: field('category'), description: field('description'),
            address: field('address'), imageUrl: field('imageUrl'), latitude,
            longitude, openingHours: field('openingHours'),
            phone: field('phone'), website: field('website'), error: field('error'),
            loading, form, submit
          };
        }
      }).mount('#place-form-app');
    </script>
  </main>

</body>

</html>
