<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head(null)}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-lg bg-white p-8 text-center shadow-md">
      <h3 class="mb-2 text-2xl font-semibold text-gray-900">An error occurred</h3>
      <hr class="mb-6 border-gray-200">
      <p class="alert alert-danger mb-6 rounded-md bg-red-100 px-4 py-3 text-sm text-red-700"
        th:text="${error}">Error</p>
      <a th:href="@{/admin/login}" class="text-blue-600 hover:underline">Back to login</a>
    </div>
  </main>

</body>

</html>
