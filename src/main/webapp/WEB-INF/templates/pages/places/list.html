<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Places')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main id="places-page" class="flex-1 min-h-0 w-full flex flex-col overflow-hidden">
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body>nav {
        position: sticky;
        top: 0;
        z-index: 1000;
        flex-shrink: 0;
      }
    </style>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <div id="app" class="flex-1 min-h-0 min-w-0 flex overflow-hidden">
      <!-- Sidebar -->
      <aside
        class="w-80 min-w-[20rem] min-h-0 overflow-y-auto overscroll-contain bg-white border-r border-gray-200 p-4 flex flex-col gap-4">
        <h1 class="text-2xl font-semibold text-gray-900">Places</h1>

        <!-- Filters -->
        <div class="flex flex-col gap-3">
          <select v-model="selectedCategory" @change="applyFilters"
            class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm">
            <option value="">All categories</option>
            <option v-for="cat in categories" :key="cat" :value="cat">
              {{ capitalize(cat) }}
            </option>
          </select>
          <input v-model="searchQuery" @input="applyFilters" type="text" placeholder="Search by name..."
            class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm" />
          <button @click="clearFilters"
            class="rounded-md border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 font-medium hover:bg-gray-50">
            Clear Filters
          </button>
        </div>

        <!-- Results count -->
        <p class="text-sm text-gray-500">{{ filteredPlaces.length }} place(s) found</p>

        <!-- Place cards -->
        <div class="flex flex-col gap-3">
          <article v-for="place in filteredPlaces" :key="place.id"
            class="relative rounded-lg bg-white border border-gray-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow"
            :style="{ borderLeftWidth: '4px', borderLeftColor: categoryColor(place.category) }">
            <div class="relative z-0 pointer-events-none flex flex-col gap-1 p-4 pb-10">
              <h2 class="text-base font-medium text-gray-900">{{ place.name }}</h2>
              <span class="text-xs font-semibold" :style="{ color: categoryColor(place.category) }">{{ place.category
                }}</span>
              <p class="text-sm text-gray-600 line-clamp-2">{{ place.address }}</p>
            </div>
            <button type="button" @click="selectPlace(place)" :aria-label="'Show details for ' + place.name"
              class="absolute inset-0 z-0 w-full cursor-pointer rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-600"></button>
            <button type="button" @click.stop="selectPlace(place)"
              class="absolute bottom-3 right-4 z-10 text-sm font-medium text-gray-500 transition-colors hover:text-gray-700 hover:underline">
              View details &rarr;
            </button>
          </article>
        </div>

        <p v-if="filteredPlaces.length === 0" class="text-gray-500 text-sm">No places found.</p>
      </aside>

      <!-- Map -->
      <div class="flex-1 min-w-0 relative">
        <div id="map" class="absolute inset-0 w-full h-full"></div>
        <aside v-if="selectedPlace" role="complementary" :aria-label="'Details for ' + selectedPlace.name"
          class="absolute inset-y-0 right-0 z-[1000] flex w-80 max-w-full flex-col overflow-y-auto bg-white shadow-xl"
          :style="{ borderLeft: '5px solid ' + categoryColor(selectedPlace.category) }">
          <div class="relative shrink-0">
            <img :src="selectedPlace.imageUrl || '/images/place-placeholder.svg'" :alt="selectedPlace.name"
              class="h-48 w-full bg-gray-100 object-cover" />
            <button type="button" @click="closeDetails" aria-label="Close place details"
              class="absolute right-3 top-3 rounded-full bg-white/90 p-2 text-gray-700 shadow hover:bg-white">
              <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>

          <div class="flex flex-1 flex-col gap-4 p-5">
            <div class="flex flex-col gap-2">
              <h2 class="text-xl font-semibold text-gray-900">{{ selectedPlace.name }}</h2>
              <div class="flex items-center gap-2 text-sm font-medium"
                :style="{ color: categoryColor(selectedPlace.category) }">
                <span class="flex h-5 w-5 items-center justify-center"
                  v-html="categoryIcon(selectedPlace.category)"></span>
                <span>{{ capitalize(selectedPlace.category) }}</span>
              </div>
            </div>
            <p v-if="selectedPlace.address" class="text-sm text-gray-600">{{ selectedPlace.address }}</p>
            <p v-if="selectedPlace.description" class="whitespace-pre-line text-sm leading-6 text-gray-700">
              {{ selectedPlace.description }}
            </p>
            <div class="mt-auto flex justify-end pt-4">
              <button type="button"
                class="rounded-md bg-gray-900 px-4 py-2 text-sm font-medium text-white hover:bg-gray-700">
                Add to plan
              </button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Lucide, vendorizado junto a Vue y Tailwind. Va antes del script de Vue porque el
         mapa de iconos se construye al montar la app, y un script clásico se ejecuta en
         orden: cuando corra createElement, window.lucide ya existe. -->
    <script th:src="@{/js/lucide.min.js}"></script>

    <!-- Vue.js app (Vue is already loaded by the layout) -->
    <script>
      const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;

      createApp({
        setup() {
          const places = ref([]);
          const selectedPlace = ref(null);
          const selectedCategory = ref('');
          const searchQuery = ref('');
          const categories = ref([]);
          let map = null;
          let mapResizeObserver = null;
          let markers = [];
          const markersByPlaceId = new Map();

          /* Tokens de categoría declarados una sola vez, en layouts/base :: head.
             Se leen del :root computado, así que ningún hex vive acá y el mapa
             del marker y el del panel comparten la misma fuente. */
          const CATEGORY_TOKEN_BY_ENUM = {
            'RESTAURANT': '--category-restaurant',
            'BAR': '--category-bar',
            'CAFE': '--category-cafe',
            'MUSEUM': '--category-museum',
            'PARK': '--category-park',
            'SHOPPING': '--category-shopping',
            'NIGHTLIFE': '--category-nightlife',
            'CULTURE': '--category-culture',
            'SPORT': '--category-sport',
            'OTHER': '--category-other'
          };
          const OTHER_COLOR_TOKEN = '--category-other';

          const categoryColor = (category) => {
            const rootStyle = getComputedStyle(document.documentElement);
            const token = CATEGORY_TOKEN_BY_ENUM[category] || OTHER_COLOR_TOKEN;
            // trim() importa: getPropertyValue devuelve el valor crudo del token,
            // con espacios alrededor en varios navegadores. El fallback también sale
            // de un token, para que ningún hex quede literal acá.
            return rootStyle.getPropertyValue(token).trim()
              || rootStyle.getPropertyValue(OTHER_COLOR_TOKEN).trim();
          };

          const filteredPlaces = computed(() => {
            return places.value.filter(place => {
              const matchCategory = !selectedCategory.value || place.category === selectedCategory.value;
              const matchSearch = !searchQuery.value ||
                place.name.toLowerCase().includes(searchQuery.value.toLowerCase());
              return matchCategory && matchSearch;
            });
          });

          const capitalize = (str) => {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
          };

          /* Iconos de categoría desde la librería vendorizada en resources/core/js/lucide.min.js,
             igual que Vue y Tailwind: sin CDN y sin depender de la red en el E2E. El mapa es
             enum -> nombre de Lucide y el SVG lo arma la propia librería (createElement), no
             un wrapper escrito a mano que se repite diez veces.

             Lucide dibuja con stroke="currentColor", así que el color se hereda del CSS y
             desaparece el parámetro que antes viajaba por función: el marker pone el color en
             su div y el panel ya lo tiene en el contenedor. */
          const categoryIcon = (category, size = 16) => {
            const icons = {
              'RESTAURANT': 'Utensils',
              'BAR': 'Wine',
              'CAFE': 'Coffee',
              'MUSEUM': 'Landmark',
              'PARK': 'Trees',
              'SHOPPING': 'ShoppingBag',
              'NIGHTLIFE': 'Music',
              'CULTURE': 'BookOpen',
              'SPORT': 'Trophy',
              'OTHER': 'MapPin'
            };
            const name = icons[category] || icons['OTHER'];
            return lucide.createElement(lucide.icons[name], {
              width: size,
              height: size,
              'aria-hidden': 'true'
            }).outerHTML;
          };

          const clearFilters = () => {
            selectedCategory.value = '';
            searchQuery.value = '';
          };

          const applyFilters = () => {
            updateMarkers();
          };

          const focusPlace = (place) => {
            const marker = markersByPlaceId.get(place.id);
            if (!map || !marker) return;

            map.stop();
            // Instant: a second animated setView issued mid-zoom-animation is superseded by
            // the first one's target, so rapid card clicks would land on the wrong marker.
            map.setView(marker.getLatLng(), Math.max(map.getZoom(), 16), { animate: false });
            marker.openPopup();
          };

          const selectPlace = (place) => {
            selectedPlace.value = place;
            focusPlace(place);
          };

          const closeDetails = () => {
            selectedPlace.value = null;
            if (map) map.closePopup();
          };

          const updateMarkers = () => {
            if (!map) return;
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            markersByPlaceId.clear();

            filteredPlaces.value.forEach(place => {
              if (place.latitude && place.longitude) {
                const color = categoryColor(place.category);
                const icon = categoryIcon(place.category);

                // El icono usa stroke="currentColor", así que este color:white es lo que
                // lo pinta de blanco sobre el fondo de categoría. Antes venía hardcodeado
                // dentro de cada SVG.
                const divIcon = L.divIcon({
                  className: 'custom-marker',
                  html: '<div style="background-color:' + color + '; color:#fff; width:32px; height:32px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; font-size:16px;">' + icon + '</div>',
                  iconSize: [32, 32],
                  iconAnchor: [16, 16],
                  popupAnchor: [0, -16]
                });

                const marker = L.marker([place.latitude, place.longitude], { icon: divIcon }).addTo(map);

                marker.bindPopup(
                  '<strong>' + place.name + '</strong><br>' +
                  place.category,
                  { autoPan: false }
                );
                marker.on('click', () => {
                  selectedPlace.value = place;
                });
                markers.push(marker);
                markersByPlaceId.set(place.id, marker);
              }
            });
          };

          onMounted(async () => {
            await nextTick();

            // The vendored Tailwind compiler runs deferred, so this can execute before any
            // stylesheet exists: L.map() inside that 1280x0 box bakes an offset center which
            // invalidateSize({ pan: false }) then preserves, leaving the opening view shifted
            // and the markers outside the window. Wait for the layout to settle first.
            const mapContainer = document.getElementById('map');
            const layoutDeadline = performance.now() + 2000;
            while (!mapContainer.clientHeight && performance.now() < layoutDeadline) {
              await new Promise((resolve) => requestAnimationFrame(resolve));
            }

            // Initialize map centered on Buenos Aires
            map = L.map('map', {
              center: [-34.6037, -58.3816],
              zoom: 13
            });

            mapResizeObserver = new ResizeObserver(() => {
              map.invalidateSize({ pan: false });
            });
            mapResizeObserver.observe(map.getContainer());
            requestAnimationFrame(() => map.invalidateSize({ pan: false }));

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            // Fetch places from API
            const response = await fetch('/api/places');
            places.value = await response.json();

            // Extract unique categories
            const cats = new Set(places.value.map(p => p.category));
            categories.value = Array.from(cats).sort();

            // Add markers
            updateMarkers();

          });

          watch(filteredPlaces, () => {
            updateMarkers();
          });

          return {
            places,
            selectedPlace,
            selectedCategory,
            searchQuery,
            categories,
            filteredPlaces,
            capitalize,
            categoryColor,
            categoryIcon,
            clearFilters,
            applyFilters,
            focusPlace,
            selectPlace,
            closeDetails
          };
        }
      }).mount('#app');
    </script>
  </main>

</body>

</html>
