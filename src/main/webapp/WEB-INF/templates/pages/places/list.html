<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Explore Places')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex flex-1 flex-col overflow-hidden lg:flex-row" id="places-app">
    <aside class="flex max-h-[48vh] w-full shrink-0 flex-col border-b border-gray-200 bg-white lg:max-h-none lg:w-96 lg:border-r lg:border-b-0">
      <div class="border-b border-gray-200 p-4">
        <h1 class="text-xl font-semibold text-gray-900">Explore Buenos Aires</h1>
        <div class="mt-4 grid gap-2">
          <label class="text-sm font-medium text-gray-700" for="place-category">Category</label>
          <select id="place-category" v-model="selectedCategory" @change="filterByCategory"
            class="w-full border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-blue-600 focus:outline-none">
            <option value="">All categories</option>
            <option v-for="category in categories" :key="category" :value="category">{{ category }}</option>
          </select>
          <label class="mt-2 text-sm font-medium text-gray-700" for="place-search">Search by name</label>
          <input id="place-search" v-model="searchQuery" @input="filterBySearch" type="search" placeholder="Search places"
            class="w-full border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder:text-gray-500 focus:border-blue-600 focus:outline-none">
        </div>
      </div>

      <p v-if="loading" class="p-4 text-sm text-gray-600" aria-live="polite">Loading places...</p>
      <p v-else-if="error" class="p-4 text-sm text-red-700" role="alert">{{ error }}</p>
      <div v-else class="overflow-y-auto p-3">
        <p v-if="places.length === 0" class="p-2 text-sm text-gray-600">No places found.</p>
        <article v-for="place in places" :key="place.id" @click="focusPlace(place)"
          class="mb-2 cursor-pointer border border-gray-200 p-3 transition-colors hover:bg-gray-50 focus-within:ring-2 focus-within:ring-blue-600">
          <div class="flex items-start justify-between gap-3">
            <h2 class="font-medium text-gray-900">{{ place.name }}</h2>
            <span class="shrink-0 px-2 py-1 text-xs font-medium text-white" :style="{ backgroundColor: categoryColor(place.category) }">
              {{ place.category }}
            </span>
          </div>
          <p v-if="place.description" class="mt-2 line-clamp-2 text-sm text-gray-600">{{ place.description }}</p>
          <a :href="'/places/' + place.id" @click.stop class="mt-2 inline-block text-sm font-medium text-blue-700 hover:underline">View details</a>
        </article>
      </div>
    </aside>

    <div id="places-map" class="min-h-[52vh] flex-1 lg:min-h-0" aria-label="Map of Buenos Aires places"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo8Qyf92U0+LEBTLz0WLwZV2K6c4bV4yKpJZSr1DdYdQ=="
    crossorigin=""></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3a3J6NLwUUwzU8VlymyqALWl6YkGN1SH7F2uCFhHOl7nZ2JJn2b5PzZueGv1jUgtP1lFB0w=="
    crossorigin="">
  <script>
    Vue.createApp({
      data() {
        return {
          places: [],
          categories: ['RESTAURANT', 'BAR', 'CAFE', 'MUSEUM', 'PARK', 'SHOPPING', 'NIGHTLIFE', 'CULTURE', 'SPORT', 'OTHER'],
          selectedCategory: '',
          searchQuery: '',
          loading: true,
          error: '',
          map: null,
          markers: [],
          searchTimeout: null,
          categoryColors: {
            RESTAURANT: '#b91c1c', BAR: '#7e22ce', CAFE: '#c2410c', MUSEUM: '#1d4ed8',
            PARK: '#15803d', SHOPPING: '#a16207', NIGHTLIFE: '#0f766e', CULTURE: '#475569',
            SPORT: '#0369a1', OTHER: '#4b5563'
          }
        };
      },
      mounted() {
        this.map = L.map('places-map').setView([-34.6037, -58.3816], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(this.map);
        this.loadPlaces();
      },
      methods: {
        categoryColor(category) {
          return this.categoryColors[category] || this.categoryColors.OTHER;
        },
        async loadPlaces(parameterName, parameterValue) {
          this.loading = true;
          this.error = '';
          try {
            const url = new URL('/api/places', window.location.origin);
            if (parameterName && parameterValue) {
              url.searchParams.set(parameterName, parameterValue);
            }
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error('The places could not be loaded.');
            }
            this.places = await response.json();
            this.addMarkers();
          } catch (exception) {
            this.error = exception.message;
          } finally {
            this.loading = false;
          }
        },
        filterByCategory() {
          this.searchQuery = '';
          this.loadPlaces('category', this.selectedCategory);
        },
        filterBySearch() {
          this.selectedCategory = '';
          window.clearTimeout(this.searchTimeout);
          this.searchTimeout = window.setTimeout(() => {
            this.loadPlaces('search', this.searchQuery.trim());
          }, 250);
        },
        addMarkers() {
          this.markers.forEach((marker) => marker.remove());
          this.markers = [];
          this.places.forEach((place) => {
            if (place.latitude == null || place.longitude == null) {
              return;
            }
            const marker = L.circleMarker([place.latitude, place.longitude], {
              radius: 8,
              fillColor: this.categoryColor(place.category),
              color: '#ffffff',
              weight: 2,
              fillOpacity: 0.9
            }).addTo(this.map);
            marker.bindPopup(this.popupContent(place));
            this.markers.push(marker);
          });
        },
        popupContent(place) {
          const content = document.createElement('div');
          const name = document.createElement('strong');
          const category = document.createElement('div');
          const link = document.createElement('a');
          name.textContent = place.name;
          category.textContent = place.category;
          link.href = '/places/' + place.id;
          link.textContent = 'View details';
          content.append(name, category, link);
          return content;
        },
        focusPlace(place) {
          if (place.latitude == null || place.longitude == null) {
            return;
          }
          this.map.setView([place.latitude, place.longitude], 16);
          const marker = this.markers.find((candidate) => candidate.getLatLng().lat === place.latitude && candidate.getLatLng().lng === place.longitude);
          if (marker) {
            marker.openPopup();
          }
        }
      }
    }).mount('#places-app');
  </script>
</body>

</html>
