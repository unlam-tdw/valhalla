<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Places')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex-1 w-full max-w-5xl mx-auto p-4 flex flex-col gap-6">
    <h1 class="text-3xl font-semibold text-gray-900">Places</h1>

    <form th:action="@{/places}" method="get" class="flex flex-wrap gap-3">
      <input type="text" name="search" th:value="${search}" placeholder="Search by name"
        class="flex-1 min-w-[12rem] rounded-md border-gray-300 bg-white border px-3 py-2" />
      <select name="category" class="flex-1 min-w-[10rem] rounded-md border-gray-300 bg-white border px-3 py-2">
        <option value="" th:selected="${category == null or category == ''}">All categories</option>
        <option value="RESTAURANT" th:selected="${category == 'RESTAURANT'}">Restaurant</option>
        <option value="BAR" th:selected="${category == 'BAR'}">Bar</option>
        <option value="CAFE" th:selected="${category == 'CAFE'}">Cafe</option>
        <option value="MUSEUM" th:selected="${category == 'MUSEUM'}">Museum</option>
        <option value="PARK" th:selected="${category == 'PARK'}">Park</option>
        <option value="SHOPPING" th:selected="${category == 'SHOPPING'}">Shopping</option>
        <option value="NIGHTLIFE" th:selected="${category == 'NIGHTLIFE'}">Nightlife</option>
        <option value="CULTURE" th:selected="${category == 'CULTURE'}">Culture</option>
        <option value="SPORT" th:selected="${category == 'SPORT'}">Sport</option>
        <option value="OTHER" th:selected="${category == 'OTHER'}">Other</option>
      </select>
      <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 text-white font-medium hover:bg-blue-700">Apply
        Filters</button>
      <a th:href="@{/places}"
        class="rounded-md border border-gray-300 bg-white px-4 py-2 text-gray-700 font-medium hover:bg-gray-50">Clear
        Filters</a>
    </form>

    <p th:if="${#lists.isEmpty(places)}" class="text-gray-600">No places found.</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <a th:each="place : ${places}" th:href="@{/places/{id}(id=${place.id})}"
        class="block rounded-lg bg-white shadow-md overflow-hidden hover:shadow-lg transition-shadow">
        <img th:if="${place.imageUrl}" th:src="${place.imageUrl}" th:alt="${place.name}"
          class="w-full h-40 object-cover" />
        <img th:unless="${place.imageUrl}" th:src="@{/images/place-placeholder.svg}"
          th:alt="|Image unavailable for ${place.name}|" class="w-full h-40 object-cover" />
        <div class="p-4 flex flex-col gap-1">
          <h2 class="text-lg font-medium text-gray-900" th:text="${place.name}">Place name</h2>
          <span class="text-sm text-blue-600 font-semibold" th:text="${place.category}">Category</span>
          <p class="text-sm text-gray-600 line-clamp-2" th:text="${place.address}">Address</p>
        </div>
      </a>
    </div>
  </main>

</body>

</html>
