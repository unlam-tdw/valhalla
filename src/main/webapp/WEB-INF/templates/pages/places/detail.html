<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/base :: head('Place detail')}"></head>

<body th:replace="~{layouts/base :: layout(~{::main})}">

  <main class="flex-1 w-full max-w-3xl mx-auto p-4 flex flex-col gap-6">
    <a th:href="@{/places}" class="text-blue-600 hover:underline text-sm self-start">&larr; Back to places</a>

    <div th:if="${place == null}" class="text-gray-600">Place not found.</div>

    <div th:if="${place != null}" class="rounded-lg bg-white shadow-md overflow-hidden flex flex-col gap-4">
      <img th:if="${place.imageUrl}" th:src="${place.imageUrl}" th:alt="${place.name}"
        class="w-full h-64 object-cover" />
      <img th:unless="${place.imageUrl}" th:src="@{/images/place-placeholder.svg}"
        th:alt="|Image unavailable for ${place.name}|" class="w-full h-64 object-cover" />

      <div class="p-6 flex flex-col gap-2">
        <h1 class="text-2xl font-semibold text-gray-900" th:text="${place.name}">Place name</h1>
        <span class="text-sm text-blue-600" th:text="${place.category}">Category</span>
        <p class="text-sm text-gray-600" th:text="${place.address}">Address</p>
        <p class="text-gray-700 whitespace-pre-line" th:text="${place.description}">Description</p>
      </div>
    </div>
  </main>

</body>

</html>
