services:
  postgres:
    image: postgres:16
    container_name: valhalla-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - valhalla
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: DockerfileDev
    container_name: valhalla-app-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - valhalla
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECURITY_SECRET: ${SECURITY_SECRET}
    volumes:
      - .:/workspace
      - maven_cache:/root/.m2
    command: sh docker-dev.sh
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  maven_cache:
    driver: local

networks:
  valhalla:
    driver: bridge
