name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  backend:
    name: Backend (Maven build, tests & quality gates)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Build, test & enforce quality gates (Checkstyle, PMD/CPD, JaCoCo 80%)
        run: |
          mvn clean verify --fail-at-end

  e2e:
    name: E2E (Playwright against a running Jetty + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: valhalla
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d valhalla"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "maven"

      - name: Install Playwright Chromium with system dependencies
        run: |
          mvn -q exec:java -e \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium"
          sudo mvn -q exec:java -e \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install-deps"

      - name: Package app (skip tests; they run in the backend job)
        run: |
          mvn -q package -DskipTests

      - name: Start Jetty against local PostgreSQL
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: valhalla
          DB_USER: user
          DB_PASSWORD: user
        run: |
          mvn jetty:run > /tmp/jetty.log 2>&1 &
          echo "Jetty starting in background"

      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/admin/login > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time" >&2
          cat /tmp/jetty.log >&2
          exit 1

      - name: Run E2E tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: valhalla
          DB_USER: user
          DB_PASSWORD: user
        run: |
          mvn -q test -Dtest=LoginViewE2E,UserViewABME2E \
            -Djacoco.skip=true \
            -Dcheckstyle.skip=true \
            -Dpmd.skip=true \
            -Dcpd.skip=true

      - name: Dump Jetty log on failure
        if: failure()
        run: cat /tmp/jetty.log

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 3
