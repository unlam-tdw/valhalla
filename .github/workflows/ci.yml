name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build + Test + Quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: valhalla
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d valhalla"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, test, and quality gates
        run: mvn clean verify --fail-at-end -DskipITs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: .code-quality/jacoco/
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: valhalla
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d valhalla"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Package app (skip tests)
        run: mvn package -DskipTests

      - name: Start Jetty
        run: mvn jetty:run &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: valhalla
          DB_USER: user
          DB_PASSWORD: user

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/admin/login > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Server did not start in time" && exit 1

      - name: Run E2E tests
        run: mvn failsafe:integration-test failsafe:verify
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: valhalla
          DB_USER: user
          DB_PASSWORD: user

      - name: Stop Jetty
        if: always()
        run: mvn jetty:stop
